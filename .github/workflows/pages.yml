name: Website

# Builds the Astryx promo site in website/ and deploys it to GitHub Pages from
# main. Requires Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: ['**']
    paths: ['website/**', 'assets/synth-image.png', '.github/workflows/pages.yml']
  pull_request:
    paths: ['website/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci
      - name: Use the current synth screenshot
        run: cp ../assets/synth-image.png public/synth.png
      - run: npm run build
      - name: Astryx doctor
        run: npx astryx doctor --built .

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
