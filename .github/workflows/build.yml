name: Build & Release

# Builds SimpleSynth (Standalone + VST3, + AU on macOS) for Windows, macOS and
# Linux on every push and pull request. Pushes to main (and v* tags) also
# publish the builds as the GitHub release vX.Y.Z, where X.Y.Z comes from
# project(... VERSION X.Y.Z) in CMakeLists.txt. The website links to
# releases/latest/download/<asset>, so the asset names below must not change.

on:
  push:
    branches: ['**']
    tags: ['v*']
    paths-ignore: ['website/**', '**.md', 'CP/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-22.04
            asset: SimpleSynth-Linux-x64.tar.gz
          - name: macOS Universal
            os: macos-14
            asset: SimpleSynth-macOS-Universal.zip
          - name: Windows x64
            os: windows-2022
            asset: SimpleSynth-Windows-x64.zip

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libasound2-dev libjack-jackd2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Configure
        shell: bash
        run: |
          args=(-DCMAKE_BUILD_TYPE=Release)
          case "$RUNNER_OS" in
            Linux)   args+=(-G Ninja) ;;
            macOS)   args+=(-G Ninja "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64") ;;
            Windows) args+=(-G "Visual Studio 17 2022" -A x64) ;;
          esac
          if [ "$RUNNER_OS" = "macOS" ]; then brew list ninja >/dev/null 2>&1 || brew install ninja; fi
          cmake -S . -B build "${args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          A=build/SimpleSynth_artefacts/Release
          STAGE=stage/SimpleSynth
          mkdir -p "$STAGE" dist
          cat > "$STAGE/README.txt" <<TXT
          SimpleSynth ${GITHUB_REF_NAME} (${GITHUB_SHA::7})
          https://github.com/${GITHUB_REPOSITORY}

          Standalone: run the app in this folder.
          VST3:       copy SimpleSynth.vst3 into your VST3 folder
                        Windows  C:\Program Files\Common Files\VST3
                        macOS    ~/Library/Audio/Plug-Ins/VST3
                        Linux    ~/.vst3
          TXT
          [ "$RUNNER_OS" = "macOS" ] && echo "AU:         copy SimpleSynth.component into ~/Library/Audio/Plug-Ins/Components" >> "$STAGE/README.txt"
          cp Resources/Fonts/OFL.txt "$STAGE/FONT-LICENSE.txt"

          case "$RUNNER_OS" in
            Linux)
              cp "$A/Standalone/SimpleSynth" "$STAGE/"
              strip "$STAGE/SimpleSynth"
              cp -R "$A/VST3/SimpleSynth.vst3" "$STAGE/"
              tar -C stage -czf "dist/${{ matrix.asset }}" SimpleSynth
              ;;
            macOS)
              cp -R "$A/Standalone/SimpleSynth.app" "$STAGE/"
              cp -R "$A/VST3/SimpleSynth.vst3" "$STAGE/"
              cp -R "$A/AU/SimpleSynth.component" "$STAGE/"
              # Unsigned builds: ad-hoc sign so they launch on Apple silicon.
              for b in "$STAGE"/*.app "$STAGE"/*.vst3 "$STAGE"/*.component; do
                codesign --force --deep --sign - "$b"
              done
              lipo -info "$STAGE/SimpleSynth.app/Contents/MacOS/SimpleSynth"
              ditto -c -k --sequesterRsrc --keepParent "$STAGE" "dist/${{ matrix.asset }}"
              ;;
            Windows)
              cp "$A/Standalone/SimpleSynth.exe" "$STAGE/"
              cp -R "$A/VST3/SimpleSynth.vst3" "$STAGE/"
              (cd stage && 7z a -tzip "../dist/${{ matrix.asset }}" SimpleSynth >/dev/null)
              ;;
          esac
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            VERSION=$(sed -nE 's/^project\(SimpleSynth VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
            TAG="v${VERSION}"
          fi
          echo "Publishing $TAG"
          ls -la dist

          cat > notes.md <<MD
          Automated build of \`${GITHUB_SHA::7}\`.

          | Platform | Download | Contents |
          |---|---|---|
          | Windows x64 | [SimpleSynth-Windows-x64.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SimpleSynth-Windows-x64.zip) | Standalone .exe, VST3 |
          | macOS (Universal) | [SimpleSynth-macOS-Universal.zip](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SimpleSynth-macOS-Universal.zip) | Standalone .app, VST3, AU |
          | Linux x64 | [SimpleSynth-Linux-x64.tar.gz](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/SimpleSynth-Linux-x64.tar.gz) | Standalone, VST3 |

          macOS builds are ad-hoc signed, not notarized: right-click the app and choose Open the first time.
          MD

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version rebuilt: move the tag to this commit and replace the assets.
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$TAG"
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --latest --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "SimpleSynth $TAG" --notes-file notes.md --latest --target "$GITHUB_SHA"
          fi
